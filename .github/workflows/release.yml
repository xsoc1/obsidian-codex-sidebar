name: Build and publish plugin

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Package only public build files
        shell: pwsh
        run: |
          $Version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          if($Version -ne $env:GITHUB_REF_NAME) { throw "Release tag and product version differ." }
          ./scripts/package-candidate.ps1 -OutputDirectory (Join-Path $PWD "dist")
      - name: Publish complete release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION="$GITHUB_REF_NAME"
          RELEASE_FLAGS=()
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "$VERSION" manifest.json main.js main.js.map styles.css \
            "dist/codex-sidebar-${VERSION}.zip" "dist/codex-sidebar-windows-bridge-${VERSION}.zip" dist/candidate-manifest.json \
            --verify-tag --draft "${RELEASE_FLAGS[@]}" --title "$VERSION - Obsidian Codex Sidebar" \
            --notes-file "docs/releases/${VERSION}.md"
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then
            gh release edit "$VERSION" --draft=false
          else
            gh release edit "$VERSION" --draft=false --prerelease=false --latest
          fi
